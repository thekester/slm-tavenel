<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">SLM-Tavenel 25M: paired BPB effect of the frozen 90 percent FSC, 10 percent HPLT mixture</title>
<desc id="desc">Four treatment-minus-control BPB estimates with paired-document 95 percent bootstrap intervals. Negative values favor the 90/10 treatment. HPLT development and held-out test improve in English and French, while FSC validation regresses slightly.</desc>
<rect width="960" height="510" rx="20" fill="#f8fafc"/>
<g font-family="Inter,Arial,sans-serif" fill="#172033">
  <text x="44" y="44" font-size="23" font-weight="700">SLM-Tavenel 25M · effect of the frozen 90/10 data mix</text>
  <text x="44" y="73" font-size="14" fill="#526078">Treatment − FSC-only BPB · paired-document bootstrap 95% CI · lower is better</text>

  <text x="44" y="138" font-size="15" font-weight="700">FSC validation · EN</text>
  <text x="44" y="186" font-size="15" font-weight="700">FSC validation · FR</text>
  <text x="44" y="246" font-size="15" font-weight="700">HPLT development · EN</text>
  <text x="44" y="294" font-size="15" font-weight="700">HPLT development · FR</text>
  <text x="44" y="354" font-size="15" font-weight="700">HPLT held-out test · EN</text>
  <text x="44" y="402" font-size="15" font-weight="700">HPLT held-out test · FR</text>

  <text x="390" y="105" font-size="12" fill="#64748b">Treatment improves ←</text>
  <line x1="390" y1="115" x2="714" y2="115" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="390" y1="423" x2="714" y2="423" stroke="#64748b" stroke-width="1.5"/>
  <line x1="390" y1="115" x2="390" y2="423" stroke="#e2e8f0"/>
  <line x1="525" y1="115" x2="525" y2="423" stroke="#e2e8f0"/>
  <line x1="660" y1="106" x2="660" y2="423" stroke="#334155" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="714" y1="115" x2="714" y2="423" stroke="#e2e8f0"/>

  <!-- FSC EN: +0.001220, CI [+0.001005,+0.001428] -->
  <line x1="662.7" y1="133" x2="663.9" y2="133" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <circle cx="663.3" cy="133" r="6" fill="#d97706"/>
  <!-- FSC FR: +0.000772, CI [+0.000555,+0.000977] -->
  <line x1="661.5" y1="181" x2="662.6" y2="181" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <circle cx="662.1" cy="181" r="6" fill="#d97706"/>

  <!-- HPLT development EN: -0.084514, CI [-0.088612,-0.080273] -->
  <line x1="420.8" y1="241" x2="443.3" y2="241" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <circle cx="431.2" cy="241" r="6" fill="#2563eb"/>
  <!-- HPLT development FR: -0.070310, CI [-0.073578,-0.067023] -->
  <line x1="461.0" y1="289" x2="478.9" y2="289" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <circle cx="470.2" cy="289" r="6" fill="#2563eb"/>

  <!-- HPLT test EN: -0.073234, CI [-0.075960,-0.070370] -->
  <line x1="454.9" y1="349" x2="470.0" y2="349" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <circle cx="462.2" cy="349" r="6" fill="#7c3aed"/>
  <!-- HPLT test FR: -0.064973, CI [-0.069597,-0.059891] -->
  <line x1="471.1" y1="397" x2="498.3" y2="397" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <circle cx="484.6" cy="397" r="6" fill="#7c3aed"/>

  <text x="390" y="446" text-anchor="middle" font-size="12" fill="#64748b">−0.10</text>
  <text x="525" y="446" text-anchor="middle" font-size="12" fill="#64748b">−0.05</text>
  <text x="660" y="446" text-anchor="middle" font-size="12" fill="#64748b">0</text>
  <text x="714" y="446" text-anchor="middle" font-size="12" fill="#64748b">+0.02</text>
  <text x="552" y="477" text-anchor="middle" font-size="13" fill="#526078">BPB difference (bits per byte)</text>

  <circle cx="760" cy="160" r="6" fill="#d97706"/><text x="775" y="165" font-size="12" fill="#526078">FSC</text>
  <circle cx="760" cy="190" r="6" fill="#2563eb"/><text x="775" y="195" font-size="12" fill="#526078">HPLT development</text>
  <circle cx="760" cy="220" r="6" fill="#7c3aed"/><text x="775" y="225" font-size="12" fill="#526078">HPLT held-out test</text>
  <text x="752" y="286" font-size="12" fill="#526078">Both HPLT test</text>
  <text x="752" y="303" font-size="12" fill="#526078">intervals exclude 0.</text>
  <text x="752" y="338" font-size="12" fill="#526078">FSC intervals also</text>
  <text x="752" y="355" font-size="12" fill="#526078">exclude 0, showing</text>
  <text x="752" y="372" font-size="12" fill="#526078">a small regression.</text>
  <text x="44" y="496" font-size="11" fill="#64748b">One fresh matched training seed pair; intervals capture document sampling, not training-seed variability. HPLT source rights/privacy remain unresolved.</text>
</g>
</svg>
