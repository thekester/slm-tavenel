# End-to-end smoke run on synthetic data (minutes on a laptop GPU, runs on CPU too).
model: configs/model/slm-tiny.yaml
data_dir: data/tokens/smoke
out_dir: runs/smoke
seed: 1234
seq_len: 256
micro_batch_size: 16
grad_accum_steps: 1
max_steps: 300
lr: 3.0e-3
min_lr: 3.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 30
decay_fraction: 0.2
dtype: bfloat16
deterministic: true
log_interval: 10
eval_interval: 50
eval_batches: 4
observe_interval: 50
ckpt_interval: 100
keep_checkpoints: 2
