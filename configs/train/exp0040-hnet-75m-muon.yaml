# EXP-0040: byte-level one-stage H-Net vs the EXP-0036a 75M BPE Muon proxy (same corpus v1 text,
# same optimizer and schedule). 1,500 updates x 2 x 8,192 bytes x 18 = 442M bytes, matching the BPE
# arm's 98.3M tokens x 4.42 bytes/token = 435M bytes (+1.7%); nominal training FLOPs per byte +6.6%.
model: configs/model/hnet-75m-proxy.yaml
data_dir: data/tokens/slm-tavenel-edu-corpus-v1-bytes
out_dir: runs/EXP-0040-hnet-75m-muon
seed: 20261029
seq_len: 8192
micro_batch_size: 2
grad_accum_steps: 18
max_steps: 1500
optimizer: muon
lr: 3.0e-3
min_lr: 3.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 100
decay_fraction: 0.2
dtype: bfloat16
activation_checkpointing: true
deterministic: false
log_interval: 50
eval_interval: 250
eval_batches: 20
observe_interval: 0
ckpt_interval: 250
keep_checkpoints: 2
resume: true
