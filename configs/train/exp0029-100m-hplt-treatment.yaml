# EXP-0029 treatment: matched 100M continuation on HPLT-rich data, tokenizer-compatible with parent.
model: configs/model/slm-100m-gated.yaml
data_dir: data/tokens/slm-tavenel-growth-candidate-v2-fsc-tokenizer
init_from: runs/EXP-0024-100m-fsc-grown-s20261025/checkpoints/step_00001500.pt
out_dir: runs/EXP-0029-100m-hplt-treatment-s20261026
seed: 20261025
seq_len: 1024
micro_batch_size: 2
grad_accum_steps: 16
max_steps: 1500
optimizer: adamw
lr: 3.0e-4
min_lr: 3.0e-5
weight_decay: 0.1
schedule: wsd
warmup_steps: 50
decay_fraction: 0.2
dtype: bfloat16
deterministic: false
log_interval: 50
eval_interval: 250
eval_batches: 20
observe_interval: 500
ckpt_interval: 500
keep_checkpoints: 3
resume: false
