model: configs/model/slm-1m-gated.yaml
data_dir: data/tokens/fsc-cc0-open-weights-v4/training
out_dir: runs/EXP-0011-1m-low-lr-continuation-2026-10-22
seed: 421111
seq_len: 1024
micro_batch_size: 16
grad_accum_steps: 2
