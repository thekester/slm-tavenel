# EXP-0013 paired 1M control; matches the v4 FSC single-pass recipe and seed.
model: configs/model/slm-1m-gated.yaml
data_dir: data/tokens/fsc-cc0-open-weights-v4/training
out_dir: runs/EXP-0013-1m-fsc-control-2026-10-22
seed: 421021
seq_len: 1024
micro_batch_size: 16
