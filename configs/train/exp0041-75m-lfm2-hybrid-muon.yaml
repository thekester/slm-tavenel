# EXP-0041: LFM2-style hybrid 75M proxy vs the EXP-0036a all-attention Muon arm (control): identical
# data (corpus v1), tokenizer, seed, optimizer, schedule and 98.3M token positions; only the token mixer
# of 10 of 16 layers differs. observe_interval is 0 because attention-pattern probes do not apply to
# convolution layers.
model: configs/model/slm-75m-lfm2-hybrid.yaml
data_dir: data/tokens/slm-tavenel-edu-corpus-v1-smollm2
out_dir: runs/EXP-0041-75m-lfm2-hybrid-muon
seed: 20261029
seq_len: 2048
micro_batch_size: 4
grad_accum_steps: 8
max_steps: 1500
optimizer: muon
lr: 3.0e-3
min_lr: 3.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 100
decay_fraction: 0.2
dtype: bfloat16
activation_checkpointing: true
deterministic: false
log_interval: 50
eval_interval: 250
eval_batches: 20
observe_interval: 0
ckpt_interval: 250
keep_checkpoints: 2
resume: true
