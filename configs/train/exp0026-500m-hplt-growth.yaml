# EXP-0026 500M treatment: function-preserving FFN growth from the EXP-0025 300M checkpoint.
# Matched with exp0026-300m-hplt-control.yaml on data, seed, token positions and schedule.
# AdamW moments are offloaded to host memory and activations are recomputed so that the
# 498M-parameter model fits the 8 GB RTX 4060 Laptop; both change memory placement only.
model: configs/model/slm-500m-fsc-growth.yaml
data_dir: data/tokens/slm-tavenel-growth-candidate-v2-fsc-tokenizer
init_from: runs/EXP-0026-500m-hplt-growth-s20261028/initialization/500m-grown-from-exp0025-300m.pt
out_dir: runs/EXP-0026-500m-hplt-growth-s20261028
seed: 20261028
seq_len: 1024
micro_batch_size: 2
grad_accum_steps: 16
max_steps: 1500
optimizer: adamw
lr: 3.0e-4
min_lr: 3.0e-5
weight_decay: 0.1
schedule: wsd
warmup_steps: 50
decay_fraction: 0.2
dtype: bfloat16
activation_checkpointing: true
optimizer_offload: true
deterministic: false
log_interval: 50
eval_interval: 250
eval_batches: 20
observe_interval: 500
ckpt_interval: 250
keep_checkpoints: 2
resume: true
