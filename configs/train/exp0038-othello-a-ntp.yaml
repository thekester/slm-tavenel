# EXP-0038 arm A ("classic"): next-move prediction only on synthetic Othello games (one game per row).
# Matched with exp0038-othello-c-jepa.yaml on data, seed, schedule and 15,000 x 8,192 = 123M token positions.
model: configs/model/othello-31m.yaml
data_dir: data/worlds/othello-v1
out_dir: runs/EXP-0038-othello-a-ntp
seed: 20261031
seq_len: 63
micro_batch_size: 128
grad_accum_steps: 1
max_steps: 15000
optimizer: muon
lr: 3.0e-3
min_lr: 3.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 300
decay_fraction: 0.2
dtype: bfloat16
deterministic: false
log_interval: 100
eval_interval: 1000
eval_batches: 20
observe_interval: 5000
ckpt_interval: 1000
keep_checkpoints: 2
resume: true
