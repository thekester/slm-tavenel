# Matched EXP-0012 treatment on the project's Python 3.11 / PyTorch 2.10 runtime.
model: configs/model/ablations/slm-10m-gated-headwise.yaml
data_dir: data/tokens/exp0012-fsc-mot-mixture
out_dir: runs/EXP-0012-10m-fsc-mot-mixture-py311-torch210-2026-10-22
seed: 1234
seq_len: 1024
micro_batch_size: 16
grad_accum_steps: 2
max_steps: 15000
lr: 3.0e-3
min_lr: 3.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 500
decay_fraction: 0.2
dtype: bfloat16
deterministic: false
log_interval: 50
eval_interval: 500
eval_batches: 20
observe_interval: 500
ckpt_interval: 1000
keep_checkpoints: 3
resume: false
