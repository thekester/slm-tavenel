# EXP-0037: classic 550M (Qwen3-0.6B scale) from scratch on edu corpus v2, Muon, master-weight offload.
# 6,100 x 65,536 = 400M token positions. Peak learning rate lowered with size (untuned; recorded).
model: configs/model/slm-550m-classic.yaml
data_dir: data/tokens/slm-tavenel-edu-corpus-v2-smollm2
out_dir: runs/EXP-0037-550m-muon
seed: 20261030
seq_len: 2048
micro_batch_size: 2
grad_accum_steps: 16
max_steps: 6100
optimizer: muon
lr: 1.5e-3
min_lr: 1.5e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 300
decay_fraction: 0.2
dtype: bfloat16
activation_checkpointing: true
master_weights_offload: true
deterministic: false
log_interval: 25
eval_interval: 250
eval_batches: 20
observe_interval: 2000
ckpt_interval: 150
keep_checkpoints: 2
resume: true
