# EXP-0008 scaling series, 1M point: same recipe as the 10M gated run (EXP-0003), smaller model.
model: configs/model/slm-1m-gated.yaml
data_dir: data/tokens/wiki-v0
out_dir: runs/slm-1m-wiki-gated
seed: 1234
seq_len: 1024
micro_batch_size: 16
grad_accum_steps: 2
max_steps: 15000
lr: 3.0e-3
min_lr: 3.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 500
decay_fraction: 0.2
dtype: bfloat16
deterministic: false
log_interval: 50
eval_interval: 500
eval_batches: 20
observe_interval: 500
ckpt_interval: 1000
keep_checkpoints: 3
