# EXP-0034a treatment: same as exp0034a-75m-ce.yaml plus logit distillation from SmolLM2-360M
# (Apache-2.0, pinned revision), loss = 0.5 * CE + 0.5 * KL(teacher || student) at temperature 1.
model: configs/model/slm-75m-classic-proxy.yaml
data_dir: data/tokens/slm-tavenel-edu-corpus-v1-smollm2
out_dir: runs/EXP-0034a-75m-distill
seed: 20261029
seq_len: 2048
micro_batch_size: 4
grad_accum_steps: 8
max_steps: 1500
optimizer: adamw
lr: 3.0e-3
min_lr: 3.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 100
decay_fraction: 0.2
dtype: bfloat16
activation_checkpointing: true
distill_teacher: HuggingFaceTB/SmolLM2-360M
distill_revision: f8027fd0eaeea54caa13c31d31b9fdc459c38b49
distill_weight: 0.5
distill_temperature: 1.0
deterministic: false
log_interval: 50
eval_interval: 250
eval_batches: 20
observe_interval: 500
ckpt_interval: 250
keep_checkpoints: 2
resume: true
