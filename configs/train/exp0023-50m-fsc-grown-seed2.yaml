# EXP-0023: grown-50M treatment matched to the EXP-0020 FSC-only 25M control.
# Local exploratory run; FSC source rights/privacy review remains unresolved.
model: configs/model/slm-50m-gated.yaml
data_dir: data/tokens/fsc-pilot-v1-scaling
init_from: runs/EXP-0023-50m-fsc-grown-s2-2026-10-24/initialization/50m-grown-from-exp0009-25m.pt
out_dir: runs/EXP-0023-50m-fsc-grown-s2-2026-10-24
seed: 20261024
seq_len: 1024
micro_batch_size: 4
grad_accum_steps: 8
max_steps: 1500
optimizer: adamw
lr: 3.0e-4
min_lr: 3.0e-5
weight_decay: 0.1
schedule: wsd
warmup_steps: 50
decay_fraction: 0.2
dtype: bfloat16
deterministic: false
log_interval: 50
eval_interval: 250
eval_batches: 20
observe_interval: 500
ckpt_interval: 500
keep_checkpoints: 3
resume: false
