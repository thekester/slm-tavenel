# EXP-0039 arm A ("classic"): next-token prediction on gridworld transition rows
# (state, action, next state). 10,000 updates x 64 rows x 130 positions = 83M token positions.
model: configs/model/gridworld-25m.yaml
data_dir: data/worlds/gridworld-v1/transitions
out_dir: runs/EXP-0039-grid-a-transitions
seed: 20261101
seq_len: 130
micro_batch_size: 64
grad_accum_steps: 1
max_steps: 10000
optimizer: muon
lr: 3.0e-3
min_lr: 3.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 300
decay_fraction: 0.2
dtype: bfloat16
deterministic: false
log_interval: 100
eval_interval: 1000
eval_batches: 20
observe_interval: 5000
ckpt_interval: 1000
keep_checkpoints: 2
resume: true
