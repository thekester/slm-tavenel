# New privacy-risk-reduced CC0 pilot. Single seed; not confirmatory.
model: configs/model/slm-1m-gated.yaml
data_dir: data/tokens/fsc-cc0-open-weights-v2/training
out_dir: runs/open-weight-candidate/1m-gated-s20261022-v2-pilot
seed: 20261022
seq_len: 1024
micro_batch_size: 16
grad_accum_steps: 2
max_steps: 805
lr: 3.0e-3
min_lr: 3.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 80
decay_fraction: 0.2
dtype: bfloat16
deterministic: false
log_interval: 25
eval_interval: 200
eval_batches: 20
observe_interval: 100
ckpt_interval: 200
keep_checkpoints: 3
