# EXP-0035: classic 1.04B from scratch on edu corpus v2, Muon, master-weight offload (bf16 device
# weights, fp32 masters on the host). 4,600 x 65,536 = 301M token positions. Untuned peak LR, recorded.
model: configs/model/slm-1b-classic.yaml
data_dir: data/tokens/slm-tavenel-edu-corpus-v2-smollm2
out_dir: runs/EXP-0035-1b-muon
seed: 20261030
seq_len: 2048
micro_batch_size: 2
grad_accum_steps: 16
max_steps: 4600
optimizer: muon
lr: 1.0e-3
min_lr: 1.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 300
decay_fraction: 0.2
dtype: bfloat16
activation_checkpointing: true
master_weights_offload: true
deterministic: false
log_interval: 25
eval_interval: 250
eval_batches: 20
observe_interval: 2000
ckpt_interval: 100
keep_checkpoints: 2
resume: true
