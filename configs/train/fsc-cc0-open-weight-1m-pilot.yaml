# Pilot on the locally audited CC0-only science corpus. This is not a release/confirmatory run.
model: configs/model/slm-1m-gated.yaml
data_dir: data/tokens/fsc-cc0-open-weights-v1/training
out_dir: runs/open-weight-candidate/1m-gated-s20261021-pilot
seed: 20261021
seq_len: 1024
micro_batch_size: 16
grad_accum_steps: 2
max_steps: 2045
lr: 3.0e-3
min_lr: 3.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 100
decay_fraction: 0.2
dtype: bfloat16
deterministic: false
log_interval: 50
eval_interval: 500
eval_batches: 20
observe_interval: 250
ckpt_interval: 500
keep_checkpoints: 3
