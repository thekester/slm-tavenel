# EXP-0006 treatment arm: same as slm-10m-wiki.yaml (EXP-0001 baseline) except document masking:
# tokens attend only within their own document inside a packed window. Validation loss is computed
# with each arm's own masking, so the arms are compared on whole-document bits per byte and benchmarks.
model: configs/model/slm-10m.yaml
data_dir: data/tokens/wiki-v0
out_dir: runs/slm-10m-wiki-docmask
seed: 1234
seq_len: 1024
micro_batch_size: 16
grad_accum_steps: 2
max_steps: 15000
doc_mask: true
lr: 3.0e-3
min_lr: 3.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 500
decay_fraction: 0.2
dtype: bfloat16
deterministic: false
log_interval: 50
eval_interval: 500
eval_batches: 20
observe_interval: 500
ckpt_interval: 1000
keep_checkpoints: 3
