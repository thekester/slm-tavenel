# EXP-0036a treatment: Muon (hidden matrices; AdamW for embeddings/norms, see slm.optim) on the 75M
# proxy. Control = EXP-0034a CE arm (configs/train/exp0034a-75m-ce.yaml): identical data (corpus v1),
# seed, schedule, learning rate and 98.3M token positions; only the optimizer differs.
model: configs/model/slm-75m-classic-proxy.yaml
data_dir: data/tokens/slm-tavenel-edu-corpus-v1-smollm2
out_dir: runs/EXP-0036a-75m-muon
seed: 20261029
seq_len: 2048
micro_batch_size: 4
grad_accum_steps: 8
max_steps: 1500
optimizer: muon
lr: 3.0e-3
min_lr: 3.0e-4
weight_decay: 0.1
schedule: wsd
warmup_steps: 100
decay_fraction: 0.2
dtype: bfloat16
activation_checkpointing: true
deterministic: false
log_interval: 50
eval_interval: 250
eval_batches: 20
observe_interval: 500
ckpt_interval: 250
keep_checkpoints: 2
resume: true
