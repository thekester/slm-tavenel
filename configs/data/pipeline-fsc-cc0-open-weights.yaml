# Prospective open-weight corpus candidate.
# Inputs are generated by scripts/audit_fsc_cc0_hal.py. Only rows whose dataset CC0 label
# matches every version returned by the HAL records API are materialized. The sources remain
# candidates until maintainer rights and privacy review is complete.
name: fsc-cc0-open-weights-candidate
registry: configs/data/sources.yaml
inputs:
  - {source: fsc-hal-cc0-audited-en, path: data/corpus-audits/fsc-cc0-hal-cleared/en.jsonl.gz, text_field: text, id_field: id, preserve_fields: [source_metadata]}
  - {source: fsc-hal-cc0-audited-fr, path: data/corpus-audits/fsc-cc0-hal-cleared/fr.jsonl.gz, text_field: text, id_field: id, preserve_fields: [source_metadata]}
steps:
  - normalize: {}
  - min_length: {min_chars: 200}
  - gopher_quality: {}
  - pii: {}
  - exact_dedup: {}
  - minhash_dedup: {num_perm: 32, bands: 8, ngram: 5, threshold: 0.8, seed: 0, max_words: 512}
  - decontaminate:
      n: 13
      eval_files:
        - {path: data/benchmarks/arc_easy.jsonl, fields: [context, choices]}
        - {path: data/benchmarks/arc_challenge.jsonl, fields: [context, choices]}
        - {path: data/benchmarks/hellaswag.jsonl, fields: [context, choices]}
        - {path: data/benchmarks/belebele_en.jsonl, fields: [context, choices]}
        - {path: data/benchmarks/belebele_fr.jsonl, fields: [context, choices]}
        - {path: data/benchmarks/winogrande.jsonl, fields: [context, choices]}
output_dir: data/processed/fsc-cc0-open-weights-candidate
