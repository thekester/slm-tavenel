# First real-text corpus for the 10M learning run: 3 English and 2 French Wikipedia shards,
# spread across each dump (see data/raw/wiki/*.fetch.json for files and hashes).
# The sources are still `candidate`, so this pipeline runs with --allow-unapproved and its
# output is exploratory: it must not be used for released weights.
#   python -m slm data fetch --source wikipedia-en --out data/raw/wiki/en.jsonl --files \
#     20231101.en/train-00000-of-00041.parquet 20231101.en/train-00013-of-00041.parquet \
#     20231101.en/train-00027-of-00041.parquet
#   python -m slm data fetch --source wikipedia-fr --out data/raw/wiki/fr.jsonl --files \
#     20231101.fr/train-00000-of-00017.parquet 20231101.fr/train-00008-of-00017.parquet
#   python -m slm data run configs/data/pipeline-wiki-v0.yaml --allow-unapproved
name: wiki-v0
registry: configs/data/sources.yaml
inputs:
  - {source: wikipedia-en, path: data/raw/wiki/en.jsonl, text_field: text, id_field: id}
  - {source: wikipedia-fr, path: data/raw/wiki/fr.jsonl, text_field: text, id_field: id}
steps:
  - normalize: {}
  - min_length: {min_chars: 200}
  - gopher_quality: {}
  - repetition: {}
  - pii: {}
  - exact_dedup: {}
  - minhash_dedup: {num_perm: 112, bands: 14, ngram: 5, threshold: 0.8, seed: 0}
output_dir: data/processed/wiki-v0
