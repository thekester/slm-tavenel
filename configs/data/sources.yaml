# Source registry. Every dataset that may enter training or evaluation is declared here.
#
# `license` is the license DECLARED by the publisher. It becomes a recorded permission only
# when a reviewer sets review.license_verified after checking the components actually used.
# Audit with:  python -m slm sources audit -v
#
# Status values:
#   candidate        under review, not usable for the core corpus
#   approved         passed review; `slm sources audit` fails if the policy disagrees
#   comparison-only  may be used in clearly labelled comparison runs, never in released weights
#   rejected         excluded, kept for the record
#
# Nothing listed below the synthetic sources has been reviewed yet. Declared licenses and
# open questions are a starting point for review, not conclusions.

sources:
  # ---- generated by this repository ---------------------------------------------------
  - id: synthetic-prose-v1
    name: Synthetic bilingual template prose
    url: src/slm/data/synthetic.py
    role: pretrain
    license: CC0-1.0
    status: approved
    revision: generator-v1
    languages: [en, fr]
    domains: [synthetic]
    review:
      provenance_verified: true
      license_verified: true
      pii_reviewed: true
      reviewer: "by construction: generated from templates in slm.data.synthetic, no external content"
      notes: Smoke-test data only. Not intended to contribute to model quality.

  - id: synthetic-arithmetic-v1
    name: Synthetic arithmetic tasks with verifier
    url: src/slm/data/synthetic.py
    role: eval
    license: CC0-1.0
    status: approved
    revision: generator-v1
    languages: [en]
    domains: [math, synthetic]
    review:
      provenance_verified: true
      license_verified: true
      pii_reviewed: true
      reviewer: "by construction: generated by slm.data.synthetic.arithmetic, no external content"

  # ---- core corpus candidates ---------------------------------------------------------
  - id: common-pile-comma-v0.1
    name: Common Pile v0.1, filtered Comma training mixture
    url: https://huggingface.co/datasets/common-pile/comma_v0.1_training_dataset
    role: pretrain
    license: mixed
    status: candidate
    attribution: Kandpal et al. (2025), arXiv:2506.05209
    languages: [en]
    domains: [web, books, code, science, government, wiki, forums]
    open_questions:
      - Pin a dataset revision.
      - List the component licenses of every subset used (component_licenses) and drop any subset
        whose terms are not on the allow-list.
      - Record attribution obligations for CC-BY and share-alike obligations for CC-BY-SA subsets.
      - Check how the per-document license metadata was established for each subset.

  - id: the-stack-v2-permissive
    name: The Stack v2, permissively licensed files only
    url: https://huggingface.co/datasets/bigcode/the-stack-v2
    role: pretrain
    license: other
    status: candidate
    attribution: Lozhkov et al. (2024), arXiv:2402.19173
    domains: [code]
    open_questions:
      - The dataset distributes file identifiers; contents are fetched from Software Heritage under
        the dataset's terms of use. Review those terms.
      - Restrict to files whose detected license is on the allow-list; record the detection method.
      - Apply the published opt-out list at the revision used.
      - Compare with the code subsets already in Common Pile to avoid double inclusion.

  - id: smoltalk2
    name: SmolTalk2 (selected subsets)
    url: https://huggingface.co/datasets/HuggingFaceTB/smoltalk2
    role: posttrain
    license: Apache-2.0
    status: candidate
    attribution: Hugging Face, SmolLM3 post-training data
    domains: [instructions, reasoning, tool-calling]
    open_questions:
      - The dataset-level license does not settle the terms of each subset. For every subset used,
        record its upstream sources and any teacher model with that model's output terms.
      - Exclude subsets whose generating model or upstream data carries incompatible terms.

  - id: tulu-3-sft-mixture
    name: Tülu 3 SFT mixture (selected subsets)
    url: https://huggingface.co/datasets/allenai/tulu-3-sft-mixture
    role: posttrain
    license: ODC-By-1.0
    status: candidate
    attribution: Lambert et al. (2024), arXiv:2411.15124
    domains: [instructions, math, code, safety]
    open_questions:
      - Several subsets contain outputs of third-party models; record each subset's origin and terms.
      - Keep only subsets whose terms permit training and redistribution of derived weights.

  - id: wikipedia-en
    name: English Wikipedia, 2023-11-01 dump
    url: https://huggingface.co/datasets/wikimedia/wikipedia
    role: pretrain
    license: CC-BY-SA-3.0
    status: candidate
    revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
    subset: 20231101.en
    attribution: Wikipedia contributors, via the Wikimedia Foundation dumps
    languages: [en]
    domains: [encyclopedia]
    open_questions:
      - Text is dual-licensed CC-BY-SA and GFDL (declared on the dataset card); confirm which terms the
        release will follow and how attribution to contributors is given.
      - Articles about living people: complete the privacy review.
      - Check the dataset's extraction (templates, tables, references removed) for artefacts.

  - id: wikipedia-fr
    name: French Wikipedia, 2023-11-01 dump
    url: https://huggingface.co/datasets/wikimedia/wikipedia
    role: pretrain
    license: CC-BY-SA-3.0
    status: candidate
    revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
    subset: 20231101.fr
    attribution: Contributeurs de Wikipédia, via les dumps de la Wikimedia Foundation
    languages: [fr]
    domains: [encyclopedia]
    open_questions:
      - Same questions as wikipedia-en.

  # ---- comparison references ------------------------------------------------------------
  # Web-crawl corpora: the compilation license (ODC-By) does not establish permission for the
  # underlying pages, so they fail the README's "recorded permissions" requirement for the
  # core corpus. They remain useful as quality baselines in labelled comparison runs.
  - id: fineweb-edu
    name: FineWeb-Edu
    url: https://huggingface.co/datasets/HuggingFaceFW/fineweb-edu
    role: pretrain
    license: ODC-By-1.0
    status: comparison-only
    attribution: Penedo et al. (2024), arXiv:2406.17557
    languages: [en]
    domains: [web, educational]

  - id: fineweb2-fra
    name: FineWeb2, French (fra_Latn)
    url: https://huggingface.co/datasets/HuggingFaceFW/fineweb-2
    role: pretrain
    license: ODC-By-1.0
    status: comparison-only
    subset: fra_Latn
    attribution: Penedo et al. (2025), arXiv:2506.20920
    languages: [fr]
    domains: [web]

  - id: dolma
    name: Dolma
    url: https://huggingface.co/datasets/allenai/dolma
    role: pretrain
    license: ODC-By-1.0
    status: comparison-only
    attribution: Soldaini et al. (2024), arXiv:2402.00159
    languages: [en]
    domains: [web, code, science, books, social]
