  # ---- comparison references ------------------------------------------------------------
  # Web-crawl corpora: the compilation license (ODC-By) does not establish permission for the
  # underlying pages, so they fail the README's "recorded permissions" requirement for the
  # core corpus. They remain useful as quality baselines in labelled comparison runs.
  - id: fineweb-edu
    name: FineWeb-Edu
    url: https://huggingface.co/datasets/HuggingFaceFW/fineweb-edu
    role: pretrain
    license: ODC-By-1.0
    status: comparison-only
    attribution: Penedo et al. (2024), arXiv:2406.17557
    languages: [en]
    domains: [web, educational]

