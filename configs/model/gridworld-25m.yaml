# EXP-0039 gridworld world-model pilot: same shape as the Othello pilot model, 16-token vocabulary,
# 131-token rows (state, action, next state).
vocab_size: 16
d_model: 512
n_layers: 8
n_heads: 8
n_kv_heads: 4
ffn_hidden: 2048
max_seq_len: 131
rope_theta: 10000.0
qk_norm: true
attn_gate: headwise
window_pattern: []
