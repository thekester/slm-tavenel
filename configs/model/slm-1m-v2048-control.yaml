# Tokenizer-only ablation: same blocks as the released 1.18M model.
# Requires a NEW train-only tokenizer and training from scratch. 592,096 parameters.
vocab_size: 2048
d_model: 96
n_layers: 4
n_heads: 3
n_kv_heads: 1
ffn_hidden: 256
max_seq_len: 1024
rope_theta: 10000.0
qk_norm: true
attn_gate: headwise
window_pattern: []
