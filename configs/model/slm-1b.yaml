# Target model, ~1.04B parameters including tied embeddings (see docs/ARCHITECTURE.md).
# Baseline choices; each one is an ablation question at 135M/300M before being frozen.
vocab_size: 49152
d_model: 1536
n_layers: 28
n_heads: 12
n_kv_heads: 4
ffn_hidden: 6144
max_seq_len: 4096
rope_theta: 100000.0
norm_eps: 1.0e-6
tie_embeddings: true
qk_norm: true
attn_gate: none
window_pattern: []
init_std: 0.02
