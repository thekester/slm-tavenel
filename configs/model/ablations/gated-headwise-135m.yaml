# Ablation A1: sigmoid head-wise output gate after attention (Qiu et al., 2025, arXiv:2505.06708).
# Hypothesis: the gate lets heads output nothing without dumping mass on the first token,
# reducing attention-sink mass at equal or better loss. Compare with slm-135m.yaml.
vocab_size: 49152
d_model: 576
n_layers: 30
n_heads: 9
n_kv_heads: 3
ffn_hidden: 1536
max_seq_len: 2048
rope_theta: 100000.0
qk_norm: true
attn_gate: headwise
window_pattern: []
