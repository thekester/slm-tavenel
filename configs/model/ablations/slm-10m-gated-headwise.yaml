# Ablation A1 at 10M: identical to slm-10m.yaml except a head-wise sigmoid gate after attention
# (Qiu et al., 2025, arXiv:2505.06708). Compared with EXP-0001 (same data, seed and schedule).
vocab_size: 8192
d_model: 256
n_layers: 10
n_heads: 4
n_kv_heads: 2
ffn_hidden: 768
max_seq_len: 1024
rope_theta: 10000.0
qk_norm: true
attn_gate: headwise
window_pattern: []
