# ~1.2M-parameter model (two thirds of it is the embedding), same family as slm-10m with the
# head-wise attention gate. Lower point of the 1M / 10M / 25M scaling series (EXP-0008).
vocab_size: 8192
d_model: 96
n_layers: 4
n_heads: 3
n_kv_heads: 1
ffn_hidden: 256
max_seq_len: 1024
rope_theta: 10000.0
qk_norm: true
attn_gate: headwise
window_pattern: []
