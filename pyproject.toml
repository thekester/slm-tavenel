[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-1b"
version = "0.1.0.dev16"
description = "SLM-1B Challenge: a reproducible, observable, open one-billion-parameter language model."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Théophile Avenel" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tokenizers>=0.15",
    "safetensors>=0.4",
]

[project.optional-dependencies]
hf = ["datasets>=2.18", "transformers>=4.51"]
energy = ["nvidia-ml-py>=12"]
dev = ["pytest>=8"]

[project.scripts]
slm = "slm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::FutureWarning"]
