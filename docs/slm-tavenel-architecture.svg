<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">SLM-Tavenel decoder architecture and published model sizes</title>
<desc id="desc">A causal decoder language model: token IDs are embedded, passed through repeated pre-normalized blocks containing grouped-query causal attention, QK normalization, RoPE, a head-wise sigmoid attention gate, and a SwiGLU feed-forward network, then projected to vocabulary logits. The 1M, 10M, and grown 25M checkpoints use four, ten, and twenty blocks respectively, with their dimensions listed below.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
</defs>
<rect width="1440" height="980" rx="24" fill="url(#bg)"/>
<text x="64" y="62" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="750" fill="#172033">SLM-Tavenel architecture</text>
<text x="64" y="96" font-family="Inter,Arial,sans-serif" font-size="17" fill="#526078">Decoder-only, causal language model · shared 8,192-token byte-level BPE vocabulary · 1,024-token context</text>

<!-- Main model flow -->
<g font-family="Inter,Arial,sans-serif">
  <rect x="64" y="130" width="285" height="58" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="206" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Input token IDs</text>
  <line x1="206" y1="188" x2="206" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="64" y="226" width="285" height="74" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="206" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Token embedding</text>
  <text x="206" y="280" text-anchor="middle" font-size="13" fill="#334155">vocabulary 8,192 · width d</text>
  <line x1="206" y1="300" x2="206" y2="328" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="64" y="337" width="285" height="70" rx="12" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
  <text x="206" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">Decoder block × L</text>
  <text x="206" y="390" text-anchor="middle" font-size="13" fill="#334155">pre-norm residual stack</text>
  <line x1="206" y1="407" x2="206" y2="435" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="64" y="444" width="285" height="58" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="206" y="480" text-anchor="middle" font-size="16" font-weight="700" fill="#172033">Final RMSNorm</text>
  <line x1="206" y1="502" x2="206" y2="530" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="64" y="539" width="285" height="68" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="206" y="568" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Language-model head</text>
  <text x="206" y="590" text-anchor="middle" font-size="13" fill="#334155">tied weights · next-token logits</text>

  <!-- Expanded decoder block -->
  <rect x="389" y="130" width="986" height="477" rx="18" fill="#fff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="425" y="172" font-size="21" font-weight="750" fill="#172033">Inside one decoder block</text>
  <text x="425" y="199" font-size="14" fill="#526078">Causal attention can read the current token and earlier tokens only.</text>

  <rect x="425" y="226" width="198" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="524" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">Input residual</text>
  <text x="524" y="273" text-anchor="middle" font-size="12" fill="#526078">h ∈ Rᵀˣᵈ</text>
  <line x1="623" y1="257" x2="663" y2="257" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="671" y="226" width="190" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="766" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#172033">RMSNorm</text>
  <text x="766" y="273" text-anchor="middle" font-size="12" fill="#526078">pre-attention</text>
  <line x1="861" y1="257" x2="901" y2="257" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="909" y="217" width="423" height="80" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1120" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Grouped-query projections: Q, K, V</text>
  <text x="1120" y="272" text-anchor="middle" font-size="13" fill="#334155">Q/K RMSNorm · RoPE on Q and K · causal mask</text>

  <path d="M1120 297 V322" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="909" y="330" width="423" height="67" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="1120" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Scaled dot-product attention</text>
  <text x="1120" y="379" text-anchor="middle" font-size="13" fill="#334155">4 query / 2 KV heads at 10M and 25M</text>
  <path d="M1120 397 V420" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="909" y="428" width="423" height="66" rx="10" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="1120" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">Head-wise sigmoid output gate</text>
  <text x="1120" y="477" text-anchor="middle" font-size="13" fill="#334155">scales each attention head before output projection</text>
  <path d="M1120 494 V517" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="909" y="525" width="423" height="60" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="1120" y="551" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Output projection + residual add</text>
  <text x="1120" y="572" text-anchor="middle" font-size="12" fill="#526078">then RMSNorm → SwiGLU MLP → residual add</text>

  <!-- residual skip -->
  <path d="M524 288 V555 H904" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="550" y="538" font-size="12" fill="#64748b">residual path</text>
</g>

<!-- Exact model comparison -->
<g font-family="Inter,Arial,sans-serif">
  <text x="64" y="670" font-size="22" font-weight="750" fill="#172033">Published SLM-Tavenel checkpoints</text>
  <text x="64" y="699" font-size="14" fill="#526078">All three use the same tokenizer size, context, RoPE base, QK normalization and gated-attention block family.</text>
  <rect x="64" y="724" width="1312" height="48" rx="8" fill="#172033"/>
  <text x="88" y="754" font-size="14" font-weight="700" fill="#fff">Checkpoint</text>
  <text x="380" y="754" font-size="14" font-weight="700" fill="#fff">Parameters</text>
  <text x="590" y="754" font-size="14" font-weight="700" fill="#fff">Layers × width</text>
  <text x="835" y="754" font-size="14" font-weight="700" fill="#fff">Heads Q/KV</text>
  <text x="1030" y="754" font-size="14" font-weight="700" fill="#fff">SwiGLU width</text>
  <text x="1230" y="754" font-size="14" font-weight="700" fill="#fff">History</text>
  <rect x="64" y="772" width="1312" height="54" fill="#fff" stroke="#e2e8f0"/>
  <rect x="64" y="826" width="1312" height="54" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="64" y="880" width="1312" height="54" fill="#fff" stroke="#e2e8f0"/>
  <g font-size="14" fill="#172033">
    <text x="88" y="806" font-weight="700">SLM-Tavenel 1M · EXP-0010</text><text x="380" y="806">1,181,920</text><text x="590" y="806">4 × 96</text><text x="835" y="806">3 / 1</text><text x="1030" y="806">256</text><text x="1230" y="806">trained from scratch</text>
    <text x="88" y="860" font-weight="700">SLM-Tavenel 10M · EXP-0009</text><text x="380" y="860">9,978,368</text><text x="590" y="860">10 × 256</text><text x="835" y="860">4 / 2</text><text x="1030" y="860">768</text><text x="1230" y="860">trained from scratch</text>
    <text x="88" y="914" font-weight="700">SLM-Tavenel grown 25M · EXP-0009</text><text x="380" y="914">25,723,648</text><text x="590" y="914">20 × 256</text><text x="835" y="914">4 / 2</text><text x="1030" y="914">1,280</text><text x="1230" y="914">grown from 10M</text>
  </g>
</g>
</svg>
