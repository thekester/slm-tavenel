<text x="99" y="389" text-anchor="end" font-family="Arial" font-size="10" fill="#526078">0%</text>
<line x1="105" y1="310.0" x2="535" y2="310.0" stroke="#dce2eb"/>
<text x="99" y="314.0" text-anchor="end" font-family="Arial" font-size="10" fill="#526078">25%</text>
