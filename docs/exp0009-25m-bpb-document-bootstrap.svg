<text x="883.9" y="244" font-family="Arial,sans-serif" font-size="11" fill="#334155">0.0557 [0.0548, 0.0567]</text>
<text x="635.0" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#334155">Difference in bits per byte</text>
