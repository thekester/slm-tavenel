<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">Paired document-bootstrap BPB difference: SLM-Tavenel 10M and grown 25M</title>
<desc id="desc">The horizontal axis shows 10M BPB minus grown-25M BPB. Positive differences favor the grown 25M checkpoint. Error bars are 95 percent paired document-bootstrap intervals, conditional on these checkpoints.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="550" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">Held-out BPB: grown 25M and 10M</text>
<text x="550" y="60" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526078">10M BPB − 25M BPB; positive values favor 25M · 20,000 paired document-bootstrap draws</text>
<line x1="250.0" y1="95" x2="250.0" y2="286" stroke="#e2e8f0"/>
<text x="250.0" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#526078">0.00</text>
<line x1="360.0" y1="95" x2="360.0" y2="286" stroke="#e2e8f0"/>
<text x="360.0" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#526078">0.01</text>
<line x1="470.0" y1="95" x2="470.0" y2="286" stroke="#e2e8f0"/>
<text x="470.0" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#526078">0.02</text>
<line x1="580.0" y1="95" x2="580.0" y2="286" stroke="#e2e8f0"/>
<text x="580.0" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#526078">0.03</text>
<line x1="690.0" y1="95" x2="690.0" y2="286" stroke="#e2e8f0"/>
<text x="690.0" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#526078">0.04</text>
<line x1="800.0" y1="95" x2="800.0" y2="286" stroke="#e2e8f0"/>
<text x="800.0" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#526078">0.05</text>
<line x1="910.0" y1="95" x2="910.0" y2="286" stroke="#e2e8f0"/>
<text x="910.0" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#526078">0.06</text>
<line x1="1020.0" y1="95" x2="1020.0" y2="286" stroke="#e2e8f0"/>
<text x="1020.0" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#526078">0.07</text>
<text x="232" y="109" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#172033">English</text>
<text x="232" y="126" text-anchor="end" font-family="Arial,sans-serif" font-size="10" fill="#64748b">685 documents</text>
<line x1="877.3" y1="112" x2="912.4" y2="112" stroke="#7c3aed" stroke-width="3"/><line x1="877.3" y1="105" x2="877.3" y2="119" stroke="#7c3aed" stroke-width="2"/><line x1="912.4" y1="105" x2="912.4" y2="119" stroke="#7c3aed" stroke-width="2"/><circle cx="893.1" cy="112" r="6" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
