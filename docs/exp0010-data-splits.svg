<rect x="674.0" y="282" width="316.0" height="42" rx="6" fill="#d97706"/>
<text x="442.0" y="308.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">English  69 (59.5%)</text>
<text x="832.0" y="308.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">French  47 (40.5%)</text>
<text x="1014.0" y="308.0" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#334155">116 documents</text>
<text x="600.0" y="365.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b">English 632 train / English 47 dev / English 69 test ; French 409 train / French 25 dev / French 47 test</text>
