<rect x="719.2" y="207" width="270.8" height="42" rx="6" fill="#d97706"/>
<text x="464.6" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">English  47 (65.3%)</text>
<text x="854.6" y="233.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">French  25 (34.7%)</text>
<text x="1014.0" y="233.0" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#334155">72 documents</text>
