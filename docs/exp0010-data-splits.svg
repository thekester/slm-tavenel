<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">SLM-Tavenel EXP-0010 document split by language</title>
<desc id="desc">Document counts in the training, development and held-out test splits, divided into English and French. Splits are document-disjoint.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="600.0" y="38.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172033">A bilingual corpus split by complete documents</text>
<text x="600.0" y="65.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#526078">Document counts by split; bar widths show the language share within each split</text>
<text x="50.0" y="158.0" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">Train</text>
<rect x="210" y="132" width="473.5" height="42" rx="6" fill="#155eef"/>
<rect x="683.5" y="132" width="306.5" height="42" rx="6" fill="#d97706"/>
<text x="446.8" y="158.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">English  632 (60.7%)</text>
<text x="836.8" y="158.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">French  409 (39.3%)</text>
<text x="1014.0" y="158.0" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#334155">1,041 documents</text>
<text x="50.0" y="233.0" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">Dev</text>
