<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Paired gate effects across ten EXP-0010 seeds</title>
<desc id="desc">Each seed shows its observed ungated minus gated English/French macro bits-per-byte difference; positive values favor the gated model. The final row shows the mean effect and the predeclared hierarchical bootstrap 95 percent interval.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="600.0" y="36.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Ten paired seeds support a positive gate effect on this corpus</text>
<text x="600.0" y="62.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#526078">Per-seed points are observed effects; only the pooled estimate has a bootstrap interval</text>
