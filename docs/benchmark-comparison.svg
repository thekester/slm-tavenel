<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">SLM-Tavenel 10M multiple-choice benchmark comparison</title>
  <desc id="desc">Grouped bars compare ARC-Easy, HellaSwag, Belebele English, and Belebele French accuracy for AdamW, head-wise gated attention, and Muon runs. The vertical axis starts at the 25 percent chance level. Pythia-14M and SmolLM2-135M are omitted because their same-harness evaluations are pending.</desc>
  <rect width="1080" height="500" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">SLM-Tavenel · 10M benchmark scores</text>
  <text x="540" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#526078">Raw accuracy · exploratory wiki-v0 · shared evaluator</text>

  <!-- Plot area: 25% (chance) to 34%. -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#526078">
    <text x="64" y="78" text-anchor="end">34 %</text>
    <text x="64" y="185" text-anchor="end">31 %</text>
    <text x="64" y="292" text-anchor="end">28 %</text>
    <text x="64" y="399" text-anchor="end">25 %</text>
  </g>
  <g stroke="#dce2eb" stroke-width="1">
    <line x1="78" y1="74" x2="790" y2="74"/>
    <line x1="78" y1="181" x2="790" y2="181"/>
    <line x1="78" y1="288" x2="790" y2="288"/>
  </g>
  <line x1="78" y1="395" x2="790" y2="395" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="790" y="389" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#4b5563">chance · 25%</text>
  <line x1="78" y1="74" x2="78" y2="395" stroke="#64748b" stroke-width="1.2"/>

  <!-- ARC-Easy -->
  <g stroke="none">
    <rect x="105" y="234.4" width="14" height="160.6" rx="2" fill="#2563eb"/>
    <rect x="124" y="229.9" width="14" height="165.1" rx="2" fill="#93c5fd"/>
    <rect x="143" y="241.3" width="14" height="153.7" rx="2" fill="#059669"/>
    <rect x="162" y="254.7" width="14" height="140.3" rx="2" fill="#6ee7b7"/>
    <rect x="181" y="193.7" width="14" height="201.3" rx="2" fill="#f59e0b"/>
    <rect x="200" y="253.8" width="14" height="141.2" rx="2" fill="#fb923c"/>
  </g>
  <!-- HellaSwag -->
  <g stroke="none">
    <rect x="275" y="306.8" width="14" height="88.2" rx="2" fill="#2563eb"/>
    <rect x="294" y="317.5" width="14" height="77.5" rx="2" fill="#93c5fd"/>
    <rect x="313" y="313.2" width="14" height="81.8" rx="2" fill="#059669"/>
    <rect x="332" y="321.7" width="14" height="73.3" rx="2" fill="#6ee7b7"/>
    <rect x="351" y="313.2" width="14" height="81.8" rx="2" fill="#f59e0b"/>
    <rect x="370" y="321.8" width="14" height="73.2" rx="2" fill="#fb923c"/>
  </g>
  <!-- Belebele English -->
  <g stroke="none">
    <rect x="445" y="339.4" width="14" height="55.6" rx="2" fill="#2563eb"/>
    <rect x="464" y="323.6" width="14" height="71.4" rx="2" fill="#93c5fd"/>
    <rect x="483" y="300.2" width="14" height="94.8" rx="2" fill="#059669"/>
    <rect x="502" y="276.5" width="14" height="118.5" rx="2" fill="#6ee7b7"/>
    <rect x="521" y="276.5" width="14" height="118.5" rx="2" fill="#f59e0b"/>
    <rect x="540" y="268.2" width="14" height="126.8" rx="2" fill="#fb923c"/>
  </g>
  <!-- Belebele French -->
  <g stroke="none">
    <rect x="615" y="184.8" width="14" height="210.2" rx="2" fill="#2563eb"/>
    <rect x="634" y="165.0" width="14" height="230.0" rx="2" fill="#93c5fd"/>
    <rect x="653" y="148.4" width="14" height="246.6" rx="2" fill="#059669"/>
    <rect x="672" y="219.7" width="14" height="175.3" rx="2" fill="#6ee7b7"/>
    <rect x="691" y="209.3" width="14" height="185.7" rx="2" fill="#f59e0b"/>
    <rect x="710" y="148.4" width="14" height="246.6" rx="2" fill="#fb923c"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#263247" text-anchor="middle">
    <text x="159" y="423">ARC-Easy</text>
    <text x="329" y="423">HellaSwag</text>
    <text x="499" y="423">Belebele EN</text>
    <text x="669" y="423">Belebele FR</text>
  </g>
  <text x="435" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#526078">Y-axis starts at 25% chance to make the small differences visible.</text>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#263247">
    <rect x="825" y="115" width="16" height="16" rx="2" fill="#2563eb"/><text x="850" y="128">AdamW · seed 1234</text>
    <rect x="825" y="148" width="16" height="16" rx="2" fill="#93c5fd"/><text x="850" y="161">AdamW · seed 2</text>
    <rect x="825" y="181" width="16" height="16" rx="2" fill="#059669"/><text x="850" y="194">Gate · seed 1234</text>
    <rect x="825" y="214" width="16" height="16" rx="2" fill="#6ee7b7"/><text x="850" y="227">Gate · seed 2</text>
    <rect x="825" y="247" width="16" height="16" rx="2" fill="#f59e0b"/><text x="850" y="260">Muon · seed 1234</text>
    <rect x="825" y="280" width="16" height="16" rx="2" fill="#fb923c"/><text x="850" y="293">Muon · seed 2</text>
    <line x1="825" y1="326" x2="845" y2="326" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 3"/><text x="850" y="330">Chance baseline</text>
    <text x="825" y="370" font-size="12" fill="#526078">External SLMs:</text>
    <text x="825" y="389" font-size="12" fill="#526078">Pythia-14M, SmolLM2-135M</text>
    <text x="825" y="408" font-size="12" fill="#526078">same-harness eval pending.</text>
  </g>
</svg>
