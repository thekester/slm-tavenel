# EXP-0045 candidate A on the corrected split (train and dev separated by source completion), one continuous run.
# 100,007,936 presented token positions (6,104 steps x 16,384), about 4 passes over 24.8M training tokens; one seed.
# Exploratory: SimpleStories remains a candidate source, so these weights are not cleared for release.
model: runs/PR1-fixes-2026-11-10/pr-tree/configs/model/slm-story-935k.yaml
data_dir: data/tokens/exp0045-simple-stories-v2
out_dir: runs/EXP-0045/story-935k-100m-v2-s421201
seed: 421201
seq_len: 256
micro_batch_size: 32
grad_accum_steps: 2
max_steps: 6104
optimizer: adamw
lr: 1.0e-3
min_lr: 1.0e-4
weight_decay: 0.1
schedule: cosine
warmup_steps: 300
dtype: bfloat16
deterministic: true
measure_energy: true
log_interval: 25
eval_interval: 250
eval_batches: 40
observe_interval: 500
ckpt_interval: 500
keep_checkpoints: 4
resume: true
